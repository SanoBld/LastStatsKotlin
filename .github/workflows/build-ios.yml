name: Build iOS

# Reusable: called by build-all.yml / release.yml, also runnable manually.
# Builds an UNSIGNED .ipa (no Apple account needed). Install it with a sideloading
# tool such as AltStore or Sideloadly, which sign it with your own Apple ID.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (e.g. 5.0.0). Empty = dev build'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 5.0.0). Empty = dev build'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          MARKETING="${VERSION%%-*}"
          cd iosApp
          sed -i '' "s/MARKETING_VERSION: \"5.0.0\"/MARKETING_VERSION: \"$MARKETING\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate

      - name: Build app (unsigned)
        env:
          IN_VERSION: ${{ inputs.version }}
          LS_KEYS: ${{ secrets.LS_KEYS }}
        run: |
          chmod +x gradlew
          VERSION="${IN_VERSION:-0.0.0-dev.${{ github.run_number }}}"
          export ORG_GRADLE_PROJECT_versionName="$VERSION"
          export ORG_GRADLE_PROJECT_versionCode=${{ github.run_number }}
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 \
            build

      - name: Package .ipa
        run: |
          mkdir -p dist ipa/Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/LastStats.app ipa/Payload/
          (cd ipa && zip -qr "$GITHUB_WORKSPACE/dist/LastStats.ipa" Payload)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/LastStats.ipa
